<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 設定網頁字元編碼為 UTF-8 -->
    <meta charset="UTF-8">
    <!-- 設定響應式視口，確保在各種裝置上皆能適配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 設定網頁標題 -->
    <title>賽博朋克霓虹 FPS 遊戲</title>
    <!-- 引入 Tailwind CSS CDN，用於快速建構現代化 UI 介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Three.js 3D 繪圖庫 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 Three.js 的 PointerLockControls 視角控制器 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <style>
        /* 設定全域字型與隱藏預設捲軸 */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #05050a;
            user-select: none;
        }
        /* 自定義畫面上的準心樣式 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border: 2px solid rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.1s ease;
        }
        /* 準心在射擊時的縮放特效類別 */
        #crosshair.shoot {
            transform: translate(-50%, -50%) scale(1.5);
            border-color: rgba(255, 0, 128, 1);
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- 遊戲 HUD 疊加層 (生命值、分數、彈藥、提示) -->
    <div id="hud" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10 hidden">
        <!-- 頂部資訊列：分數與生命值 -->
        <div class="flex justify-between items-center text-cyan-400 font-bold tracking-wider text-xl drop-shadow-[0_0_10px_rgba(0,255,255,0.7)]">
            <div class="bg-black/40 border border-cyan-500/50 px-4 py-2 rounded-lg backdrop-blur-sm">
                分數: <span id="score-val" class="text-white">0</span>
            </div>
            <div class="bg-black/40 border border-cyan-500/50 px-4 py-2 rounded-lg backdrop-blur-sm">
                生命值: <span id="health-val" class="text-red-500">100</span> / 100
            </div>
        </div>

        <!-- 畫面中央準心 -->
        <div id="crosshair"></div>

        <!-- 底部資訊列：彈藥數與操作提示 -->
        <div class="flex justify-between items-end text-cyan-400 font-bold tracking-wider text-lg drop-shadow-[0_0_10px_rgba(0,255,255,0.7)]">
            <div class="bg-black/40 border border-cyan-500/50 px-4 py-2 rounded-lg backdrop-blur-sm">
                彈藥: <span id="ammo-val" class="text-yellow-400">30</span> / 30 (按下 R 鍵換彈)
            </div>
            <div class="bg-black/40 border border-cyan-500/50 px-4 py-2 rounded-lg backdrop-blur-sm text-sm text-gray-300">
                WASD: 移動 | 滑鼠: 視角 | 左鍵: 射擊
            </div>
        </div>
    </div>

    <!-- 遊戲開始畫面覆蓋層 -->
    <div id="start-screen" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-30 backdrop-blur-md">
        <div class="text-center p-8 border-2 border-cyan-500/80 rounded-2xl bg-black/60 shadow-[0_0_30px_rgba(0,255,255,0.4)] max-w-lg w-full mx-4">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-4 tracking-widest drop-shadow-[0_0_15px_rgba(0,255,255,0.8)]">
                CYBER SURGE FPS
            </h1>
            <p class="text-gray-300 mb-6 text-sm leading-relaxed">
                進入賽博競技場，消滅所有霓虹靶標！<br>
                小心遭遇攻擊，維持你的生存！
            </p>
            <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-pink-500 text-black font-extrabold text-lg rounded-xl shadow-[0_0_20px_rgba(0,255,255,0.6)] hover:opacity-90 active:scale-95 transition-all cursor-pointer">
                進入遊戲
            </button>
        </div>
    </div>

    <!-- 遊戲結束畫面覆蓋層 -->
    <div id="gameover-screen" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-30 backdrop-blur-md hidden">
        <div class="text-center p-8 border-2 border-pink-500/80 rounded-2xl bg-black/60 shadow-[0_0_30px_rgba(255,0,128,0.4)] max-w-lg w-full mx-4">
            <h1 class="text-4xl font-black text-pink-500 mb-2 tracking-widest drop-shadow-[0_0_15px_rgba(255,0,128,0.8)]">
                遊戲結束
            </h1>
            <p class="text-gray-300 mb-4 text-lg">
                最終得分: <span id="final-score" class="text-cyan-400 font-bold">0</span>
            </p>
            <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-pink-500 to-cyan-500 text-black font-extrabold text-lg rounded-xl shadow-[0_0_20px_rgba(255,0,128,0.6)] hover:opacity-90 active:scale-95 transition-all cursor-pointer">
                重新開始
            </button>
        </div>
    </div>

    <!-- JavaScript 遊戲核心邏輯 -->
    <script>
        // --- 1. 音效生成器 (使用 Web Audio API，無需外部音訊檔案) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 播放射擊音效
        function playShootSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // 播放擊中音效
        function playHitSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // --- 2. 遊戲全域變數宣告 ---
        let scene, camera, renderer, controls;
        let score = 0, health = 100, ammo = 30;
        let isGameRunning = false;
        let enemies = [];
        let particles = [];
        let gunMesh;
        
        // 鍵盤移動狀態控制
        const moveState = { forward: false, backward: false, left: false, right: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        // --- 3. 初始化 Three.js 3D 環境 ---
        function init() {
            // 建立 3D 場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050a);
            scene.fog = new THREE.FogExp2(0x05050a, 0.025);

            // 建立攝影機 (視角 75 度，長寬比自適應)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // 設定玩家眼部高度

            // 建立 WebGL 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 設定 PointerLockControls 控制視角
            controls = new THREE.PointerLockControls(camera, renderer.domElement);

            // --- 4. 環境光源與裝飾燈光 ---
            const ambientLight = new THREE.AmbientLight(0x222244, 1.5);
            scene.add(ambientLight);

            // 建立競技場地板 (賽博朋克網格)
            const floorGeo = new THREE.PlaneGeometry(100, 100, 50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x111122, 
                roughness: 0.8, 
                metalness: 0.2,
                wireframe: true 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 建立周圍霓虹柱裝飾
            createCyberPillars();

            // 建立第一人稱槍械模型
            createGunModel();

            // --- 5. 事件監聽器設定 ---
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);

            // 按鈕點擊事件：開始遊戲
            document.getElementById('start-btn').addEventListener('click', () => {
                controls.lock();
            });

            // 按鈕點擊事件：重新開始遊戲
            document.getElementById('restart-btn').addEventListener('click', () => {
                resetGame();
                controls.lock();
            });

            // 監聽滑鼠游標鎖定狀態變化
            controls.addEventListener('lock', () => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('gameover-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                isGameRunning = true;
                prevTime = performance.now();
            });

            controls.addEventListener('unlock', () => {
                if (health > 0 && isGameRunning) {
                    document.getElementById('start-screen').classList.remove('hidden');
                    document.getElementById('hud').classList.add('hidden');
                    isGameRunning = false;
                }
            });
        }

        // --- 6. 建立周邊賽博朋克霓虹裝飾柱 ---
        function createCyberPillars() {
            const pillarGeo = new THREE.BoxGeometry(2, 15, 2);
            for (let i = 0; i < 20; i++) {
                const color = i % 2 === 0 ? 0x00ffff : 0xff007f;
                const pillarMat = new THREE.MeshStandardMaterial({ 
                    color: 0x111111, 
                    emissive: color, 
                    emissiveIntensity: 0.8,
                    roughness: 0.2 
                });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                
                // 隨機分佈在競技場四周
                const angle = (i / 20) * Math.PI * 2;
                const radius = 35 + Math.random() * 10;
                pillar.position.set(Math.cos(angle) * radius, 7.5, Math.sin(angle) * radius);
                scene.add(pillar);
            }
        }

        // --- 7. 建立玩家手持槍械模型 ---
        function createGunModel() {
            const gunGroup = new THREE.Group();

            // 槍身主體
            const bodyGeo = new THREE.BoxGeometry(0.12, 0.15, 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.1 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0, -0.2, -0.5);
            gunGroup.add(body);

            // 槍管裝飾 (霓虹藍發光條)
            const barrelGeo = new THREE.BoxGeometry(0.06, 0.06, 0.4);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.position.set(0, -0.15, -0.7);
            gunGroup.add(barrel);

            // 將槍械模型綁定到攝影機（使槍隨著視角移動）
            camera.add(gunGroup);
            scene.add(camera);
            gunMesh = gunGroup;
        }

        // --- 8. 鍵盤按下與釋放事件處理 ---
        function onKeyDown(event) {
            if (!isGameRunning) return;
            switch (event.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
                case 'KeyR': reloadAmmo(); break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
            }
        }

        // --- 9. 換彈機制 ---
        function reloadAmmo() {
            ammo = 30;
            document.getElementById('ammo-val').innerText = ammo;
        }

        // --- 10. 滑鼠點擊射擊與射線檢測 (Raycast) ---
        function onMouseDown(event) {
            if (!isGameRunning || event.button !== 0) return; // 僅回應滑鼠左鍵

            if (ammo <= 0) {
                reloadAmmo();
                return;
            }

            ammo--;
            document.getElementById('ammo-val').innerText = ammo;
            playShootSound();

            // 準心動畫特效
            const crosshair = document.getElementById('crosshair');
            crosshair.classList.add('shoot');
            setTimeout(() => crosshair.classList.remove('shoot'), 100);

            // 槍械微幅後座力動畫
            if (gunMesh) {
                gunMesh.position.z += 0.08;
                setTimeout(() => gunMesh.position.z -= 0.08, 80);
            }

            // 使用 Three.js 射線檢測判定擊中目標
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0); // 畫面正中央
            raycaster.setFromCamera(center, camera);

            // 收集所有敵人群體的網格物件進行碰撞檢測
            const targetMeshes = enemies.map(e => e.mesh);
            const intersects = raycaster.intersectObjects(targetMeshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                // 尋找對應的敵人物件
                const enemyIndex = enemies.findIndex(e => e.mesh === hitMesh);
                if (enemyIndex !== -1) {
                    playHitSound();
                    createHitParticles(hitMesh.position);
                    scene.remove(hitMesh);
                    enemies.splice(enemyIndex, 1);

                    // 增加分數
                    score += 100;
                    document.getElementById('score-val').innerText = score;
                }
            }
        }

        // --- 11. 建立擊中粒子爆炸特效 ---
        function createHitParticles(pos) {
            for (let i = 0; i < 15; i++) {
                const pGeo = new THREE.SphereGeometry(0.08, 4, 4);
                const pMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
                const particle = new THREE.Mesh(pGeo, pMat);
                particle.position.copy(pos);

                // 隨機噴射方向速度向量
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3
                );
                particle.life = 20; // 粒子存活幀數
                scene.add(particle);
                particles.push(particle);
            }
        }

        // --- 12. 隨機生成敵方靶標 ---
        function spawnEnemy() {
            if (!isGameRunning || enemies.length >= 8) return; // 限制場上最大敵人數量

            const geo = new THREE.IcosahedronGeometry(0.8, 1);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x000000, 
                emissive: 0xff0055, 
                emissiveIntensity: 0.9,
                wireframe: false 
            });
            const mesh = new THREE.Mesh(geo, mat);

            // 在隨機距離玩家一定範圍外生成
            const angle = Math.random() * Math.PI * 2;
            const distance = 20 + Math.random() * 20;
            mesh.position.set(
                camera.position.x + Math.cos(angle) * distance,
                1 + Math.random() * 3,
                camera.position.z + Math.sin(angle) * distance
            );

            scene.add(mesh);
            enemies.push({ mesh: mesh, speed: 0.04 + Math.random() * 0.03 });
        }

        // --- 13. 視窗尺寸改變自動調整渲染器與相機 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 14. 遊戲重置函式 ---
        function resetGame() {
            score = 0;
            health = 100;
            ammo = 30;
            document.getElementById('score-val').innerText = score;
            document.getElementById('health-val').innerText = health;
            document.getElementById('ammo-val').innerText = ammo;

            // 清除現存所有敵人
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];

            // 清除現存粒子
            particles.forEach(p => scene.remove(p));
            particles = [];
        }

        // --- 15. 遊戲結束處理 ---
        function gameOver() {
            isGameRunning = false;
            controls.unlock();
            document.getElementById('final-score').innerText = score;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // --- 16. 遊戲主迴圈 (每幀更新與渲染) ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (isGameRunning) {
                // 移動物理運算與平滑處理
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize(); // 確保斜向移動速度一致

                if (moveState.forward || moveState.backward) velocity.z -= direction.z * 40.0 * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // 隨機生成敵人計時觸發
                if (Math.random() < 0.03) {
                    spawnEnemy();
                }

                // 更新敵人物件行為（向玩家移動並進行碰撞傷害判定）
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.mesh.lookAt(camera.position);
                    enemy.mesh.translateOnAxis(new THREE.Vector3(0, 0, 1), enemy.speed);

                    // 檢查敵方與玩家的距離是否過近（造成傷害）
                    const distToPlayer = enemy.mesh.position.distanceTo(camera.position);
                    if (distToPlayer < 1.5) {
                        health -= 10;
                        document.getElementById('health-val').innerText = Math.max(0, health);
                        
                        // 移除碰撞到的敵人
                        scene.remove(enemy.mesh);
                        enemies.splice(i, 1);

                        if (health <= 0) {
                            gameOver();
                        }
                    }
                }

                // 更新粒子特效位置與生命週期
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.position.add(p.velocity);
                    p.life--;
                    if (p.life <= 0) {
                        scene.remove(p);
                        particles.splice(i, 1);
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        // --- 17. 頁面載入完成後啟動遊戲初始化 ---
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
